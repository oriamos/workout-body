name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Formatting is not a matter of taste here: an unformatted diff makes
      # every later review noisier than it needs to be.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race because the HTTP server and the MCP handler are concurrent, and a
      # data race there corrupts training data rather than crashing loudly.
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      # The store is the layer that touches the data. Let coverage rot anywhere
      # else, but not there. Most store behaviour is exercised from the
      # integration and e2e packages (real SQLite, real binary), so coverage of
      # the store package is measured across all of them, as statement coverage.
      - name: coverage floor for the store
        run: |
          go test -count=1 -coverpkg=./internal/sqlitestore/ -coverprofile=store.cov \
            ./internal/sqlitestore/ ./internal/integration/ ./internal/e2e/
          pct="$(go tool cover -func=store.cov | awk '/^total:/ {sub(/%/,"",$3); print $3}')"
          echo "sqlitestore statement coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN {exit !(p < 70)}' && {
            echo "below the 70% floor" >&2
            exit 1
          }
          echo "ok"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image is what actually ships, so a broken Dockerfile must fail here
      # and not at deploy time.
      - name: docker build
        run: docker build -t training-mcp:ci .
