openapi: 3.1.0
info:
  title: Workout engine API
  version: "1"
  summary: JSON HTTP API (v1) for the personal workout engine UI.
  description: |
    A thin adapter over the same training service the MCP server uses; every
    business rule lives in the engine.

    ## Conventions
    - **JSON only**, UTF-8, `snake_case` field names. Request bodies require
      `Content-Type: application/json` (PATCH also accepts
      `application/merge-patch+json`), are limited to 1 MiB and are decoded
      strictly: unknown fields are rejected with a `validation_error` naming
      the field, and trailing data is a `bad_request`. Video uploads are the
      exception: they are streamed and bounded by `media.max_video_bytes`
      from `GET /config`.
    - **Dates** are local calendar dates `YYYY-MM-DD` in the server's
      configured timezone (see `GET /config`). The literal `today` is
      accepted wherever a date is accepted (path segments and `from`/`to`).
    - **Units**: weight in kilograms (`*_kg`); RPE on a 1-10 scale; RIR
      (reps in reserve) 0-10.
    - **Nullable vs optional**: a performed set's metrics (`weight_kg`,
      `reps`, `rpe`, `rir`) are nullable. In responses `null` means *not
      recorded* (different from `0`, which is an explicit zero load). In a
      POST body, absent and `null` both mean *not provided*. In a PATCH body
      (merge-patch semantics) an absent member is *unchanged* and `null`
      *clears* the value back to not recorded.
    - **Revisions and ETags**: workouts, sets and plans carry a `revision`
      that increments on every change. Responses for a single workout, set or
      plan carry `ETag: "<revision>"`. Mutating a set, a plan or a workout
      prescription (PATCH, PUT, DELETE) requires `If-Match` with that ETag
      (for prescriptions, the workout's): missing -> `428`, stale -> `412`. Appending sets/prescriptions may send an optional `If-Match`
      (workout revision). A conflict reported by the engine maps to `412`
      when the request carried `If-Match`, otherwise `409`.
    - **Idempotency**: `POST /workouts/{date}/sets` honours an
      `Idempotency-Key` header (max 128 chars). The first success returns
      `201`; a replay of the same key with the same body returns `200` with
      `replayed: true` and writes nothing; the same key with a different body
      is a `409`.
    - **Videos**: sets and exercises can carry videos (MP4, MOV, WebM). The
      container is verified from the bytes, never from `Content-Type` or the
      file name. When the server has no media storage, media endpoints answer
      `501 media_disabled`.
    - **Nutrition**: one entry per portion actually eaten, with kcal and grams
      for the *whole portion* (not per 100 g). A nutrient that is `null` was
      not provided and is never treated as 0; values are finite and >= 0.
      Entries are dated by consumption date in the server timezone (today or
      earlier). A meal can be made of `items` (ingredients with their own
      values for the amount used); its values are then the items' sums, and
      `GET /nutrition/items` suggests ingredients logged before. Day totals are computed from the entries on every read.
      Targets are effective-dated: a change applies from its date until the
      next change and never alters earlier dates. Nutrition never creates or
      touches a workout. Without nutrition support the endpoints answer
      `501 nutrition_disabled`.
    - **Body weight**: at most one weigh-in per local date (today or
      earlier), in kilograms (20-400). `PUT /weight/entries/{date}` is an
      upsert keyed by the date, so a retry is harmless; `If-Match` is
      optional there. Weekly trends use the configured week (Sunday-start by default) and average only
      the days that were logged; missing data is `null`, never interpolated.
      Without weight support the endpoints answer `501 weight_disabled`.
    - **Errors** always use the `Error` envelope. `500` responses never carry
      internal details (they are logged server-side).
    - **Authentication** is a bearer token applied by the outer server layer.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: meta
  - name: workouts
  - name: sets
  - name: plans
  - name: exercises
  - name: stats
  - name: media
  - name: nutrition
  - name: weight

paths:
  /config:
    get:
      tags: [meta]
      operationId: getConfig
      summary: Server configuration relevant to clients
      responses:
        "200":
          description: Configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
        "500": { $ref: "#/components/responses/Internal" }

  /openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenAPI
      summary: This OpenAPI document
      responses:
        "200":
          description: The embedded OpenAPI 3.1 document.
          content:
            application/yaml:
              schema: { type: string }

  /workouts:
    get:
      tags: [workouts]
      operationId: listWorkouts
      summary: List workout summaries, newest first
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: limit
          in: query
          description: Maximum number of workouts (1-100, default 20).
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Workout summaries.
          content:
            application/json:
              schema:
                type: object
                required: [workouts]
                properties:
                  workouts:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }

  /workouts/{date}:
    parameters:
      - $ref: "#/components/parameters/Date"
    get:
      tags: [workouts]
      operationId: getWorkout
      summary: Get the workout of a date with its sets and progress
      description: Never creates anything; a date without a workout is `404`.
      responses:
        "200":
          description: The workout.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [workouts]
      operationId: ensureWorkout
      summary: Get or create the (empty) workout of a date
      description: |
        Idempotent get-or-create, so no request body and no `If-Match`: the
        first call creates an empty workout (`201`), later calls return it
        (`200`). Safe under concurrent calls: there is only ever one workout per
        local date. Use it to open a free workout before any set is logged.
      responses:
        "200":
          description: The workout already existed.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "201":
          description: The workout was created by this call.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }

  /workouts/{date}/sets:
    parameters:
      - $ref: "#/components/parameters/Date"
    post:
      tags: [workouts]
      operationId: logSets
      summary: Append performed sets and/or merge prescriptions (atomic)
      description: |
        Creates the workout for the date if it does not exist (one workout per
        local date). Everything is applied in one transaction or not at all.
        Sets cannot be logged for future dates; prescriptions can.
        Prescriptions merge into existing ones: fields left at 0/absent keep the
        stored value. Prescriptions never create completed sets.
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogSetsRequest" }
      responses:
        "201":
          description: Written. `created` says whether the workout was new.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResult" }
        "200":
          description: Idempotent replay (`replayed` is true); nothing new was written.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }

  /workouts/{date}/plan:
    parameters:
      - $ref: "#/components/parameters/Date"
    post:
      tags: [workouts]
      operationId: followPlan
      summary: Make the workout of a date follow a plan
      description: |
        Creates the workout if needed and copies the plan's prescriptions into
        it (exercises the workout already prescribes keep their own). Following
        the same plan again is a no-op; a workout that already follows a
        different plan is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_id]
              properties:
                plan_id: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The workout after following the plan.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }

  /workouts/{date}/prescriptions/{exercise}:
    parameters:
      - $ref: "#/components/parameters/Date"
      - name: exercise
        in: path
        required: true
        description: Exercise name or alias (URL-encoded), as prescribed in the workout.
        schema: { type: string }
    patch:
      tags: [workouts]
      operationId: adjustPrescription
      summary: Adjust one prescription of the workout
      description: |
        Merge-patch: only the members given change. `null` clears
        `target_weight_kg` or `target_rir` (back to not prescribed) and is
        rejected for the other members. `If-Match` carries the workout ETag and
        is checked atomically with the edit.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionPatch" }
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/PrescriptionPatch" }
      responses:
        "200":
          description: The workout after the change.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [workouts]
      operationId: removePrescription
      summary: Remove one prescription from the workout
      description: Sets already logged for the exercise are kept and show up as off-plan work. `If-Match` carries the workout ETag.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      responses:
        "200":
          description: The workout after the change.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }

  /sets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Stable set id.
        schema: { type: integer, minimum: 1 }
    get:
      tags: [sets]
      operationId: getSet
      summary: Get one set
      responses:
        "200":
          description: The set.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Set" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [sets]
      operationId: updateSet
      summary: Change fields of one set (merge-patch)
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPatch" }
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/SetPatch" }
      responses:
        "200":
          description: The updated set.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Set" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [sets]
      operationId: deleteSet
      summary: Delete one set
      description: Remaining sets keep their ids; positions are compacted.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      responses:
        "200":
          description: Deleted. The workout as it is now is included.
          content:
            application/json:
              schema:
                type: object
                required: [deleted_set_id, workout]
                properties:
                  deleted_set_id: { type: integer }
                  workout:
                    oneOf:
                      - $ref: "#/components/schemas/Workout"
                      - type: "null"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }

  /sets/{id}/videos:
    parameters:
      - $ref: "#/components/parameters/SetID"
    get:
      tags: [media]
      operationId: listSetVideos
      summary: List the videos of a set
      responses:
        "200": { $ref: "#/components/responses/VideoList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/MediaDisabled" }
    post:
      tags: [media]
      operationId: uploadSetVideo
      summary: Upload a video of a set (e.g. a form check)
      description: At most 5 videos per set; one more is a `409`. Deleting the set deletes its videos.
      parameters:
        - $ref: "#/components/parameters/UploadFilename"
        - $ref: "#/components/parameters/UploadCaption"
      requestBody: { $ref: "#/components/requestBodies/VideoUpload" }
      responses:
        "201": { $ref: "#/components/responses/MediaCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/MediaDisabled" }

  /plans:
    get:
      tags: [plans]
      operationId: listPlans
      summary: List plans
      responses:
        "200":
          description: Plans.
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/Plan" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [plans]
      operationId: createPlan
      summary: Create a plan from a plan document
      description: Equivalent to import with `on_conflict=error`. A plan with the same name (case-insensitive) is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanDocument" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location:
              description: URL of the new plan.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }

  /plans/import:
    post:
      tags: [plans]
      operationId: importPlan
      summary: Import a plan document
      description: |
        Plans are matched by name (case-insensitive). With
        `on_conflict=replace` an existing plan keeps its id and has its notes,
        exercises and schedule replaced (a document without `schedule` clears
        the plan's schedule); workouts already created from it are never
        changed. `dry_run=true` validates and reports the outcome without
        writing (no ETag; a would-be-created plan has id 0).
        Import is naturally idempotent, so it takes no `Idempotency-Key`:
        retrying `on_conflict=error` after a success gets `409` (the plan
        exists), and retrying `on_conflict=replace` yields the same plan.
      parameters:
        - name: on_conflict
          in: query
          schema: { type: string, enum: [error, replace], default: error }
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanDocument" }
      responses:
        "201":
          description: A new plan was created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location:
              description: URL of the new plan.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanImportResult" }
        "200":
          description: An existing plan was replaced, or a dry run.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }

  /plans/{id}:
    parameters:
      - $ref: "#/components/parameters/PlanID"
    get:
      tags: [plans]
      operationId: getPlan
      summary: Get one plan
      responses:
        "200":
          description: The plan.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [plans]
      operationId: replacePlan
      summary: Replace a plan's name, notes, exercises and schedule
      description: A document without `schedule` clears the plan's schedule.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanDocument" }
      responses:
        "200":
          description: The replaced plan.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [plans]
      operationId: deletePlan
      summary: Delete a plan
      description: Workouts that followed it keep their copied prescriptions and plan name.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }

  /plans/{id}/schedule:
    parameters:
      - $ref: "#/components/parameters/PlanID"
    put:
      tags: [plans]
      operationId: setPlanSchedule
      summary: Set or clear a plan's schedule
      description: |
        `{"schedule": {...}}` sets it, `{"schedule": null}` clears it. Day
        names are normalised (e.g. `Monday` -> `mon`), a repeated day is an
        error, and stored Monday first. A schedule never creates or changes a
        workout.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schedule]
              properties:
                schedule:
                  oneOf:
                    - $ref: "#/components/schemas/Schedule"
                    - type: "null"
      responses:
        "200":
          description: The plan with its new schedule.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }

  /schedule:
    get:
      tags: [plans]
      operationId: getSchedule
      summary: What is planned for a range of days, and how it went
      description: |
        Lays every scheduled plan over the range (default: the current
        week (Sunday-Saturday by default, WORKOUT_WEEK_START) in the server timezone; with only `from`, 7 days
        from it). At most 62 days. Read-only: never creates a workout.

        Fixed-day (`weekdays`) plans appear on their days with a status:
        - `done`: the date's workout follows that plan and has at least one
          completed non-warm-up set;
        - `started`: the date's workout follows that plan but has no such set yet;
        - `missed`: the date has passed without it;
        - `due`: the date is today and it is not done;
        - `upcoming`: the date is in the future.

        Frequency (`times_per_week`) plans get one `weekly_targets` entry per
        week overlapping the range: `target`, `completed`
        (workouts following the plan with completed working sets), `remaining`
        (never below 0) and the `dates` that counted. Plans without a schedule
        are listed in `unscheduled_plans`.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The schedule view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }

  /plans/{id}/export:
    parameters:
      - $ref: "#/components/parameters/PlanID"
    get:
      tags: [plans]
      operationId: exportPlan
      summary: Export a plan as a portable plan document
      description: Importing the result recreates the same prescriptions.
      responses:
        "200":
          description: The plan document, as a download.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Content-Disposition:
              description: '`attachment; filename="<slugged-plan-name>.json"`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: List exercises with their aliases
      responses:
        "200":
          description: Exercises, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [exercises]
                properties:
                  exercises:
                    type: array
                    items: { $ref: "#/components/schemas/Exercise" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [exercises]
      operationId: createExercise
      summary: Add an exercise to the library (or get the existing one)
      description: |
        The name is normalized (lower case, collapsed whitespace). If it, or an
        alias, already resolves to an exercise, that exercise is returned with
        `200` and nothing is created. Otherwise a new exercise is created
        (`201`) and `similar` lists existing names that look close, so a typo
        can be noticed. Names are never merged implicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: The name already resolves to this exercise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateExerciseResult" }
        "201":
          description: Created.
          headers:
            Location: { description: URL of the new exercise., schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateExerciseResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }

  /exercises/{ref}:
    parameters:
      - $ref: "#/components/parameters/ExerciseRef"
    get:
      tags: [exercises]
      operationId: getExercise
      summary: Get one exercise by id, name or alias
      responses:
        "200":
          description: The exercise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [exercises]
      operationId: renameExercise
      summary: Rename an exercise
      description: |
        Changes the canonical name everywhere it is referenced. The old name
        does not become an alias. A name already used by another exercise (or
        its alias) is a `409`: renaming never merges exercises.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: The renamed exercise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }

  /exercises/{ref}/aliases:
    parameters:
      - $ref: "#/components/parameters/ExerciseRef"
    post:
      tags: [exercises]
      operationId: addExerciseAlias
      summary: Add an alias to an exercise
      description: |
        Adding an alias the exercise already has is a no-op. An alias that is
        another exercise's name or alias is a `409`: aliases never merge
        exercises.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [alias]
              properties:
                alias: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: The exercise with its aliases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }

  /exercises/{ref}/aliases/{alias}:
    parameters:
      - $ref: "#/components/parameters/ExerciseRef"
      - name: alias
        in: path
        required: true
        description: The alias to remove (URL-encoded).
        schema: { type: string }
    delete:
      tags: [exercises]
      operationId: removeExerciseAlias
      summary: Remove an alias from an exercise
      description: Sets keep pointing at the exercise. An alias that does not belong to this exercise is a `404`.
      responses:
        "200":
          description: The exercise with its remaining aliases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /exercises/{ref}/history:
    parameters:
      - $ref: "#/components/parameters/ExerciseRef"
    get:
      tags: [exercises]
      operationId: exerciseHistory
      summary: Recorded sets of one exercise, newest first, with the best set
      parameters:
        - name: limit
          in: query
          description: Maximum number of sets (1-500, default 50).
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: History.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /exercises/{ref}/stats:
    parameters:
      - $ref: "#/components/parameters/ExerciseRef"
    get:
      tags: [exercises]
      operationId: exerciseStats
      summary: Progression of one exercise over a date range
      description: Warm-up sets are counted separately and excluded from volume and bests.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /exercises/{ref}/videos:
    parameters:
      - $ref: "#/components/parameters/ExerciseRef"
    get:
      tags: [media]
      operationId: listExerciseVideos
      summary: List the how-to videos of an exercise
      responses:
        "200": { $ref: "#/components/responses/VideoList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/MediaDisabled" }
    post:
      tags: [media]
      operationId: uploadExerciseVideo
      summary: Upload a how-to video for an exercise
      description: At most 10 videos per exercise; one more is a `409`. Never creates the exercise.
      parameters:
        - $ref: "#/components/parameters/UploadFilename"
        - $ref: "#/components/parameters/UploadCaption"
      requestBody: { $ref: "#/components/requestBodies/VideoUpload" }
      responses:
        "201": { $ref: "#/components/responses/MediaCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/MediaDisabled" }

  /exercises/{ref}/guide:
    parameters:
      - $ref: "#/components/parameters/ExerciseRef"
    get:
      tags: [exercises]
      operationId: exerciseGuide
      summary: Written instructions and how-to videos of an exercise
      description: Works without media storage; `videos` is then empty.
      responses:
        "200":
          description: The guide.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseGuide" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /exercises/{ref}/instructions:
    parameters:
      - $ref: "#/components/parameters/ExerciseRef"
    put:
      tags: [exercises]
      operationId: setExerciseInstructions
      summary: Set the written how-to of an exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [instructions]
              properties:
                instructions: { type: string, maxLength: 5000, description: Plain text; trimmed; an empty string clears it. }
      responses:
        "200":
          description: The updated guide.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseGuide" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/MediaDisabled" }

  /media/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Media id.
        schema: { type: integer, minimum: 1 }
    get:
      tags: [media]
      operationId: getMedia
      summary: Stream a video
      description: |
        Supports `Range` (206 partial content), `If-Range` and
        `If-None-Match` (304). The type is the one verified at upload.
      parameters:
        - name: Range
          in: header
          required: false
          description: 'Byte range, e.g. `bytes=0-1023`.'
          schema: { type: string }
      responses:
        "200":
          description: The whole video.
          headers:
            ETag: { $ref: "#/components/headers/MediaETag" }
            Content-Disposition: { $ref: "#/components/headers/MediaDisposition" }
            Cache-Control: { $ref: "#/components/headers/MediaCacheControl" }
            Accept-Ranges:
              description: "`bytes`."
              schema: { type: string }
          content:
            video/mp4: { schema: { type: string, format: binary } }
            video/quicktime: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
        "206":
          description: The requested byte range.
          headers:
            ETag: { $ref: "#/components/headers/MediaETag" }
            Content-Range:
              description: 'e.g. `bytes 0-1023/2048`.'
              schema: { type: string }
          content:
            video/mp4: { schema: { type: string, format: binary } }
            video/quicktime: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
        "304":
          description: Not modified (If-None-Match matched).
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416":
          description: Range not satisfiable.
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/MediaDisabled" }
    delete:
      tags: [media]
      operationId: deleteMedia
      summary: Delete a video and its file
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/MediaDisabled" }

  /nutrition/entries:
    get:
      tags: [nutrition]
      operationId: listNutritionEntries
      summary: List nutrition entries
      description: |
        Newest date first, chronological within a day. Filter by one `date`
        or a `from`/`to` range (not both), and/or `q`. With no date filter the
        latest entries across all dates are listed (for re-using previous meals).
      parameters:
        - name: date
          in: query
          description: A single local date (`YYYY-MM-DD` or `today`).
          schema: { type: string }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: q
          in: query
          description: Case-insensitive substring of the name.
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          description: 1-500, default 100.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }
    post:
      tags: [nutrition]
      operationId: addNutritionEntry
      summary: Log one consumed portion
      description: |
        Only `name` is required. Nutrients are stored exactly as given: a
        missing value stays missing (never 0) and calories are never derived
        from macros. A meal can instead be made of `items` (ingredients, each
        with values for the amount used): its values are then the sums of the
        items that provide them, and `incomplete_values` names any value only
        some items provide. Values given directly together with `items` are
        rejected (issue on `items`); issues inside an item name it, e.g.
        `items[1].amount_g`. With `Idempotency-Key`, a retry returns the original entry
        (`200`, `replayed: true`); the same key with a different body is a `409`.
        Without a key, posting twice intentionally logs two portions.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionEntryInput" }
      responses:
        "201": { $ref: "#/components/responses/NutritionEntryCreated" }
        "200": { $ref: "#/components/responses/NutritionEntryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }

  /nutrition/entries/{id}:
    parameters:
      - $ref: "#/components/parameters/EntryID"
    get:
      tags: [nutrition]
      operationId: getNutritionEntry
      summary: Get one nutrition entry
      responses:
        "200":
          description: The entry.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }
    patch:
      tags: [nutrition]
      operationId: updateNutritionEntry
      summary: Change fields of an entry (merge-patch)
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionEntryPatch" }
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/NutritionEntryPatch" }
      responses:
        "200":
          description: The updated entry.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }
    delete:
      tags: [nutrition]
      operationId: deleteNutritionEntry
      summary: Delete an entry
      description: Copies made from it are kept.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }

  /nutrition/entries/{id}/copy:
    parameters:
      - $ref: "#/components/parameters/EntryID"
    post:
      tags: [nutrition]
      operationId: copyNutritionEntry
      summary: Log a previous entry again
      description: |
        Creates a new, independent entry with the same name and values
        (`copied_from` points at the source; editing either never changes the
        other). The body may be omitted; `date` defaults to today.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                date: { type: string, description: Consumption date (`YYYY-MM-DD` or `today`); today or earlier. }
      responses:
        "201": { $ref: "#/components/responses/NutritionEntryCreated" }
        "200": { $ref: "#/components/responses/NutritionEntryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }

  /nutrition/items:
    get:
      tags: [nutrition]
      operationId: suggestNutritionItems
      summary: Ingredients logged before
      description: |
        The latest use of each ingredient name (case-insensitive), most
        recently used first, with its values for its `amount_g` — for reusing
        them (scaling by amount when the portion differs).
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of the ingredient name.
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          description: 1-100, default 20.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionItemSuggestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }

  /nutrition/days:
    get:
      tags: [nutrition]
      operationId: nutritionDays
      summary: Daily summaries over a range (calendar / overview)
      description: One entry per date, including days without entries. `from` defaults to today, `to` to `from`; at most 366 days.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Days, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }

  /nutrition/days/{date}:
    parameters:
      - $ref: "#/components/parameters/NutritionDate"
    get:
      tags: [nutrition]
      operationId: nutritionDay
      summary: One day's entries, totals and targets
      responses:
        "200":
          description: The day.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }

  /nutrition/targets:
    get:
      tags: [nutrition]
      operationId: getNutritionTargets
      summary: Targets in effect on a date, and every change
      description: The ETag is the revision of the targets in effect on `date` (`"0"` when none were ever set); send it as If-Match to change targets from that date.
      parameters:
        - name: date
          in: query
          description: Local date (`YYYY-MM-DD` or `today`); default today.
          schema: { type: string }
      responses:
        "200":
          description: Targets and history.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [targets, history]
                properties:
                  targets: { $ref: "#/components/schemas/NutritionTargets" }
                  history:
                    type: array
                    description: Every change, oldest first.
                    items: { $ref: "#/components/schemas/NutritionTargets" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }

  /nutrition/targets/{date}:
    parameters:
      - name: date
        in: path
        required: true
        description: The date the change takes effect (`YYYY-MM-DD` or `today`; future dates allowed).
        schema: { type: string }
    put:
      tags: [nutrition]
      operationId: setNutritionTargets
      summary: Change targets from a date forward
      description: |
        Merge-patch against the targets in effect on that date: a number sets
        a target, `null` removes it, an absent member keeps what was in effect.
        The change applies from this date until the next change; earlier dates
        are never affected. `If-Match` must be the revision of the targets in
        effect on that date (`"0"` when none are set).
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 'Revision of the targets in effect on the date, e.g. `"3"`; `"0"` when none are set. Missing -> 428, stale -> 412.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetsPatch" }
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/TargetsPatch" }
      responses:
        "200":
          description: The targets now in effect from that date.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionTargets" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }
    delete:
      tags: [nutrition]
      operationId: deleteNutritionTargets
      summary: Undo the target change made on a date
      description: The previous change (if any) applies again from that date. `If-Match` is that change's revision.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      responses:
        "204":
          description: Removed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NutritionDisabled" }

  /weight/entries:
    get:
      tags: [weight]
      operationId: listWeighIns
      summary: List weigh-ins
      description: Weigh-ins in an inclusive date range (both bounds optional), oldest first.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Weigh-ins, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/WeighIn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/WeightDisabled" }

  /weight/entries/{date}:
    parameters:
      - $ref: "#/components/parameters/Date"
    get:
      tags: [weight]
      operationId: getWeighIn
      summary: The weigh-in of a date
      responses:
        "200":
          description: The weigh-in.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeighIn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/WeightDisabled" }
    put:
      tags: [weight]
      operationId: putWeighIn
      summary: Record (or replace) the weigh-in of a date
      description: |
        Upsert keyed by the date (today or earlier): there is at most one
        weigh-in per local date, so sending it again replaces it. Sending the
        same values again changes nothing (no revision bump), which makes a
        retry harmless. `201` when the date had no weigh-in, `200` otherwise.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: 'Optional. The expected revision, e.g. `"2"`; `"0"` means the date must not have a weigh-in yet; `*` means it must have one. Stale -> 412.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeighInInput" }
      responses:
        "201":
          description: Recorded.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location:
              description: URL of the weigh-in, `/api/v1/weight/entries/{date}`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeighIn" }
        "200":
          description: Replaced, or unchanged when the values were the same.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeighIn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/WeightDisabled" }
    delete:
      tags: [weight]
      operationId: deleteWeighIn
      summary: Delete the weigh-in of a date
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/WeightDisabled" }

  /weight/trend:
    get:
      tags: [weight]
      operationId: weightTrend
      summary: Weekly averages and week-over-week change
      description: |
        The last `weeks` weeks (configured week start, Sunday by default) ending with the week that
        contains `to`. Averages use only the days that have a weigh-in; a week
        without any has null statistics, and a change is null when either
        week is empty. Nothing is interpolated.
      parameters:
        - name: to
          in: query
          description: Last date (`YYYY-MM-DD` or `today`); default today.
          schema: { type: string }
        - name: weeks
          in: query
          description: Number of weeks, 1-104; default 8.
          schema: { type: integer, minimum: 1, maximum: 104 }
      responses:
        "200":
          description: The trend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeightTrend" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/WeightDisabled" }

  /stats/summary:
    get:
      tags: [stats]
      operationId: trainingSummary
      summary: Training overview of a date range
      description: Defaults to the 28 days ending today. Warm-ups are counted separately.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  headers:
    MediaETag:
      description: The video's SHA-256 as a strong entity tag.
      schema: { type: string }
    MediaDisposition:
      description: '`inline; filename="<stored file name>"` (non-ASCII names use `filename*`).'
      schema: { type: string }
    MediaCacheControl:
      description: "`private, max-age=3600`."
      schema: { type: string }
    ETag:
      description: The resource revision as a strong entity tag, e.g. `"3"`. Equals the body's `revision`.
      schema: { type: string, example: '"3"' }

  parameters:
    EntryID:
      name: id
      in: path
      required: true
      description: Nutrition entry id.
      schema: { type: integer, minimum: 1 }
    NutritionDate:
      name: date
      in: path
      required: true
      description: Local date `YYYY-MM-DD` in the server timezone, or `today`.
      schema: { type: string }
    SetID:
      name: id
      in: path
      required: true
      description: Stable set id.
      schema: { type: integer, minimum: 1 }
    UploadFilename:
      name: filename
      in: query
      required: false
      description: File name to record for a raw-body upload (path components are stripped). Multipart uploads use the part's file name.
      schema: { type: string, maxLength: 120 }
    UploadCaption:
      name: caption
      in: query
      required: false
      description: Optional caption (max 200 chars). A multipart `caption` part overrides it.
      schema: { type: string, maxLength: 200 }
    Date:
      name: date
      in: path
      required: true
      description: Local calendar date `YYYY-MM-DD` in the server timezone, or `today`.
      schema: { type: string, example: "2026-03-10" }
    From:
      name: from
      in: query
      description: Inclusive start date (`YYYY-MM-DD` or `today`).
      schema: { type: string }
    To:
      name: to
      in: query
      description: Inclusive end date (`YYYY-MM-DD` or `today`).
      schema: { type: string }
    PlanID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ExerciseRef:
      name: ref
      in: path
      required: true
      description: Exercise id, canonical name or alias (URL-encoded). Never creates an exercise.
      schema: { type: string }
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: The ETag from your last read. Missing -> 428, stale -> 412. `*` matches any revision.
      schema: { type: string, example: '"3"' }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Optional workout ETag; when sent and stale the request fails with 412.
      schema: { type: string, example: '"3"' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Client-chosen key (max 128 chars) making a retry safe. Replays return 200 with `replayed: true`."
      schema: { type: string, maxLength: 128 }

  requestBodies:
    VideoUpload:
      required: true
      description: |
        Either the raw video bytes (any of the listed video types or
        `application/octet-stream`; use `?filename=` and `?caption=`), or
        `multipart/form-data` with an optional `caption` text part followed by
        a `file` part. The upload is streamed, never buffered. Only MP4, MOV
        and WebM are accepted, as verified from the bytes; anything else is a
        `validation_error` on field `file`.
      content:
        video/mp4: { schema: { type: string, format: binary } }
        video/quicktime: { schema: { type: string, format: binary } }
        video/webm: { schema: { type: string, format: binary } }
        application/octet-stream: { schema: { type: string, format: binary } }
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              caption: { type: string, maxLength: 200, description: Must come before the file part. }
              file: { type: string, format: binary }
          encoding:
            file:
              contentType: video/mp4, video/quicktime, video/webm, application/octet-stream

  responses:
    VideoList:
      description: Videos, oldest first.
      content:
        application/json:
          schema:
            type: object
            required: [videos]
            properties:
              videos:
                type: array
                items: { $ref: "#/components/schemas/Media" }
    MediaCreated:
      description: Stored.
      headers:
        Location:
          description: URL of the video, `/api/v1/media/{id}`.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Media" }
    BadRequest:
      description: "`validation_error` (with `issues`) or `bad_request` (malformed JSON, bad header)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "`conflict`: the write was rejected to protect existing data (duplicate name, reused idempotency key, plan already followed, stale revision without If-Match)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionFailed:
      description: "`precondition_failed`: If-Match did not match the current revision. Re-read and retry."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionRequired:
      description: "`precondition_required`: this mutation requires If-Match."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: "`payload_too_large`: JSON body over 1 MiB, or a video over `media.max_video_bytes`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: "`unsupported_media_type`: body sent without `Content-Type: application/json`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MediaDisabled:
      description: "`media_disabled`: video storage is not configured on this server."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NutritionDisabled:
      description: "`nutrition_disabled`: this server's store does not support nutrition."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WeightDisabled:
      description: "`weight_disabled`: this server's store does not support weigh-ins."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NutritionEntryResult:
      description: The entry and whether it was an idempotent replay.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NutritionEntryResult" }
    NutritionEntryCreated:
      description: Created.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Location:
          description: URL of the new entry.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NutritionEntryResult" }
    Internal:
      description: "`internal`: unexpected server error; details are logged, never returned."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - validation_error
                - not_found
                - conflict
                - precondition_failed
                - precondition_required
                - bad_request
                - internal
                - method_not_allowed
                - unsupported_media_type
                - payload_too_large
                - media_disabled
                - nutrition_disabled
                - weight_disabled
            message: { type: string }
            issues:
              type: array
              description: Present for `validation_error`; one entry per problem found.
              items: { $ref: "#/components/schemas/Issue" }

    Issue:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: 'JSON path of the rejected value, e.g. `sets[1].reps`; empty for whole-request problems.' }
        message: { type: string }

    Config:
      type: object
      required: [timezone, today, api_version, media]
      properties:
        timezone: { type: string, description: IANA timezone dates are resolved in., example: Asia/Jerusalem }
        today: { type: string, description: Current local date `YYYY-MM-DD`. }
        api_version: { type: string, example: v1 }
        media:
          type: object
          required: [enabled, max_video_bytes]
          properties:
            enabled: { type: boolean, description: False when the server has no video storage (media endpoints answer 501). }
            max_video_bytes: { type: integer, description: Largest accepted video in bytes (0 when media is disabled). }

    SetType:
      type: string
      description: Every type except `warmup` counts as completed working work in analytics. Defaults to `working`.
      enum: [warmup, working, backoff, drop, failure]

    SetInput:
      type: object
      additionalProperties: false
      description: |
        One performed set. Give `exercise` (name or alias; an unknown name
        creates a new exercise, reported in `new_exercises`) or `exercise_id`
        (wins when both are given). Metrics absent or `null` are not recorded.
      properties:
        exercise: { type: string, maxLength: 100 }
        exercise_id: { type: integer, minimum: 1 }
        weight_kg: { type: [number, "null"], minimum: 0, maximum: 2000, description: Load in kg; 0 is an explicit zero load. }
        reps: { type: [integer, "null"], minimum: 1, maximum: 1000 }
        rpe: { type: [number, "null"], minimum: 1, maximum: 10, description: Rate of perceived exertion (1-10). }
        rir: { type: [number, "null"], minimum: 0, maximum: 10, description: Reps in reserve (0-10). }
        set_type: { $ref: "#/components/schemas/SetType" }
        notes: { type: string, maxLength: 500 }
        technique: { type: string, maxLength: 40, description: 'Optional intensity technique, e.g. "drop set".' }
        superset: { type: string, maxLength: 40, description: Round label; derived from the workout's prescription when empty. }

    PrescriptionInput:
      type: object
      additionalProperties: false
      required: [exercise, target_sets]
      description: A planned exercise. Zero/absent targets mean not prescribed (and, when merging, keep the stored value).
      properties:
        exercise: { type: string, maxLength: 100 }
        target_sets: { type: integer, minimum: 1, maximum: 20 }
        rep_min: { type: integer, minimum: 0, maximum: 1000 }
        rep_max: { type: integer, minimum: 0, maximum: 1000 }
        target_rpe: { type: number, minimum: 0, maximum: 10, description: RPE 1-10; 0 = no target. }
        target_weight_kg: { type: [number, "null"], minimum: 0, maximum: 2000 }
        target_rir: { type: [number, "null"], minimum: 0, maximum: 10 }
        superset: { type: string, maxLength: 40 }
        notes: { type: string, maxLength: 2000 }

    LogSetsRequest:
      type: object
      additionalProperties: false
      description: At least one set or prescription. At most 100 sets and 40 prescriptions.
      properties:
        sets:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SetInput" }
        prescriptions:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/PrescriptionInput" }
        plan_id:
          type: integer
          minimum: 1
          description: Follow this plan if the workout follows none yet (409 if it follows another).

    SetPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Merge-patch of a set: absent = unchanged. `null` clears `weight_kg`,
        `reps`, `rpe` or `rir` back to not recorded; `null` is rejected for
        the other members.
      properties:
        exercise: { type: string, maxLength: 100 }
        exercise_id: { type: integer, minimum: 1 }
        weight_kg: { type: [number, "null"], minimum: 0, maximum: 2000 }
        reps: { type: [integer, "null"], minimum: 1, maximum: 1000 }
        rpe: { type: [number, "null"], minimum: 1, maximum: 10 }
        rir: { type: [number, "null"], minimum: 0, maximum: 10 }
        set_type: { $ref: "#/components/schemas/SetType" }
        notes: { type: string, maxLength: 500 }
        technique: { type: string, maxLength: 40 }

    CreateExerciseResult:
      type: object
      additionalProperties: false
      required: [exercise, created, similar]
      properties:
        exercise: { $ref: "#/components/schemas/Exercise" }
        created: { type: boolean }
        similar:
          type: array
          items: { type: string }
          description: Existing names close to a newly created one (empty when nothing was created).
    PrescriptionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Merge-patch of a prescription; absent = unchanged; `null` clears `target_weight_kg`, `target_rir` and `notes`, and is rejected elsewhere.
      properties:
        target_sets: { type: integer, minimum: 1, maximum: 20 }
        rep_min: { type: integer, minimum: 0 }
        rep_max: { type: integer, minimum: 0 }
        target_rpe: { type: number, minimum: 0, maximum: 10 }
        target_weight_kg: { type: [number, "null"], minimum: 0, maximum: 2000 }
        target_rir: { type: [number, "null"], minimum: 0, maximum: 10 }
        skipped: { type: boolean, description: Consciously dropped today; stays listed in progress. }
        notes: { type: [string, "null"], maxLength: 2000, description: Replaces the prescription's note; `null` or an empty string clears it. }

    Set:
      type: object
      required: [id, session_id, position, exercise_id, exercise, weight_kg, reps, rpe, rir, set_type, revision, si]
      description: A performed set. Address it by `id`, never by `set_number`.
      properties:
        id: { type: integer }
        session_id: { type: integer, description: Id of the workout the set belongs to. }
        position: { type: integer, description: 1-based order in the workout. }
        exercise_id: { type: integer }
        exercise: { type: string, description: Canonical exercise name. }
        weight_kg: { type: [number, "null"], description: kg; null = not recorded. }
        reps: { type: [integer, "null"], description: null = not recorded. }
        rpe: { type: [number, "null"], description: 1-10; null = not recorded. }
        rir: { type: [number, "null"], description: 0-10; null = not recorded. }
        set_type: { $ref: "#/components/schemas/SetType" }
        notes: { type: string, description: Omitted when empty. }
        set_number: { type: integer, description: 1-based order among sets of the same exercise. Only present in workout reads. }
        revision: { type: integer }
        si: { type: number, description: Legacy RPE-derived intensity score; 0 without RPE. }
        technique: { type: string, description: Omitted when empty. }
        superset: { type: string, description: Omitted when empty. }

    Prescription:
      type: object
      required: [position, exercise, target_sets]
      description: A planned exercise (in a plan or a workout). Zero-valued targets are omitted (not prescribed).
      properties:
        position: { type: integer }
        exercise: { type: string }
        target_sets: { type: integer }
        rep_min: { type: integer }
        rep_max: { type: integer }
        target_rpe: { type: number }
        target_weight_kg: { type: number, description: kg; omitted when not prescribed. }
        target_rir: { type: number, description: Omitted when not prescribed. }
        superset: { type: string }
        notes: { type: string }

    ProgressItem:
      type: object
      required: [exercise, target_sets, done_sets]
      description: |
        Planned versus completed work for one exercise. Exercises done but not
        planned appear with `target_sets` 0. Only logged non-warm-up sets count
        as done.
      properties:
        exercise: { type: string }
        muscle_group: { type: string }
        superset: { type: string }
        notes: { type: string }
        target_sets: { type: integer }
        done_sets: { type: integer }
        warmup_sets: { type: integer }
        rep_min: { type: integer }
        rep_max: { type: integer }
        target_rpe: { type: number }
        target_weight_kg: { type: number }
        target_rir: { type: number }
        skipped: { type: boolean }

    Workout:
      type: object
      required: [id, date, sets, progress, total_si, plan_id, plan_name, revision]
      description: The single workout of a local date.
      properties:
        id: { type: integer }
        date: { type: string, description: Local date `YYYY-MM-DD`. }
        sets:
          type: array
          items: { $ref: "#/components/schemas/Set" }
        progress:
          type: array
          items: { $ref: "#/components/schemas/ProgressItem" }
        total_si: { type: number }
        plan_id: { type: [integer, "null"], description: Plan followed; null when none. }
        plan_name: { type: [string, "null"], description: Snapshot of the plan name; null when none. }
        revision: { type: integer }

    WorkoutSummary:
      type: object
      required: [id, date, set_count, total_si]
      properties:
        id: { type: integer }
        date: { type: string }
        set_count: { type: integer }
        total_si: { type: number }
        plan_name: { type: string, description: Omitted when the workout follows no plan. }

    NewExercise:
      type: object
      required: [id, name]
      description: An exercise created by this write; `similar` lists existing names that look alike (possible typo).
      properties:
        id: { type: integer }
        name: { type: string }
        similar:
          type: array
          items: { type: string }

    BatchResult:
      type: object
      required: [workout, created, sets, prescriptions, new_exercises, replayed]
      properties:
        workout: { $ref: "#/components/schemas/Workout" }
        created: { type: boolean, description: True when this request created the workout. }
        sets:
          type: array
          description: The sets appended by this request.
          items: { $ref: "#/components/schemas/Set" }
        prescriptions:
          type: array
          description: The prescriptions as stored after merging.
          items: { $ref: "#/components/schemas/Prescription" }
        new_exercises:
          type: array
          items: { $ref: "#/components/schemas/NewExercise" }
        replayed: { type: boolean, description: True for an idempotent replay; nothing new was written. }

    PlanDocumentItem:
      type: object
      additionalProperties: false
      required: [exercise, sets]
      properties:
        exercise: { type: string, maxLength: 100 }
        sets: { type: integer, minimum: 1, maximum: 20 }
        rep_min: { type: integer, minimum: 0 }
        rep_max: { type: integer, minimum: 0 }
        target_weight_kg: { type: number, minimum: 0, maximum: 2000 }
        target_rpe: { type: number, minimum: 1, maximum: 10 }
        target_rir: { type: number, minimum: 0, maximum: 10 }
        superset: { type: string, maxLength: 40 }
        notes: { type: string, maxLength: 2000 }

    PlanDocument:
      type: object
      additionalProperties: false
      required: [format, version, name, items]
      description: The portable plan format (docs/schemas/workout-plan.v1.schema.json). Exercises must be unique within a plan.
      properties:
        format: { type: string, const: workout-plan }
        version: { type: integer, const: 1 }
        name: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 2000 }
        schedule:
          $ref: "#/components/schemas/Schedule"
          description: Optional; omit it for an unscheduled plan (`null` is rejected).
        items:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: "#/components/schemas/PlanDocumentItem" }

    Plan:
      type: object
      required: [id, name, revision, total_sets, schedule]
      properties:
        id: { type: integer }
        name: { type: string }
        notes: { type: string }
        schedule:
          description: When the plan is meant to be done; null = unscheduled.
          oneOf:
            - $ref: "#/components/schemas/Schedule"
            - type: "null"
        items:
          type: array
          items: { $ref: "#/components/schemas/Prescription" }
        revision: { type: integer }
        total_sets: { type: integer }

    PlanImportResult:
      type: object
      required: [plan, created, replaced, dry_run, new_exercises]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        created: { type: boolean }
        replaced: { type: boolean }
        dry_run: { type: boolean }
        new_exercises:
          type: array
          items: { $ref: "#/components/schemas/NewExercise" }

    Exercise:
      type: object
      required: [id, name, aliases, set_count]
      properties:
        id: { type: integer }
        name: { type: string, description: Canonical normalized (lowercase) name. }
        aliases:
          type: array
          items: { type: string }
        muscle_group: { type: string }
        set_count: { type: integer }

    ExerciseHistorySet:
      type: object
      required: [set_id, session_id, date, weight_kg, reps, rpe, rir, set_type, si, est_1rm]
      properties:
        set_id: { type: integer }
        session_id: { type: integer }
        date: { type: string }
        weight_kg: { type: [number, "null"] }
        reps: { type: [integer, "null"] }
        rpe: { type: [number, "null"] }
        rir: { type: [number, "null"] }
        set_type: { $ref: "#/components/schemas/SetType" }
        notes: { type: string }
        technique: { type: string }
        superset: { type: string }
        si: { type: number }
        est_1rm: { type: number, description: Epley estimate in kg; 0 when weight or reps is missing. }

    ExerciseHistory:
      type: object
      required: [exercise, sets]
      properties:
        exercise: { type: string }
        muscle_group: { type: string }
        sets:
          type: array
          items: { $ref: "#/components/schemas/ExerciseHistorySet" }
        best: { $ref: "#/components/schemas/ExerciseHistorySet" }

    ExerciseBest:
      type: object
      required: [value, date, set_id]
      properties:
        value: { type: number }
        date: { type: string }
        set_id: { type: integer }

    ExerciseStatsPoint:
      type: object
      required: [date, working_sets, warmup_sets, total_reps, volume_kg, top_weight_kg, best_e1rm, unrecorded_sets]
      properties:
        date: { type: string }
        working_sets: { type: integer }
        warmup_sets: { type: integer }
        total_reps: { type: integer }
        volume_kg: { type: number, description: Sum of weight x reps over working sets with both recorded. }
        top_weight_kg: { type: [number, "null"] }
        best_e1rm: { type: number }
        unrecorded_sets: { type: integer, description: Working sets missing weight or reps. }

    ExerciseStats:
      type: object
      required: [exercise_id, exercise, workouts, working_sets, warmup_sets, volume_kg, max_weight_kg, best_e1rm, max_reps, points]
      properties:
        exercise_id: { type: integer }
        exercise: { type: string }
        from: { type: string }
        to: { type: string }
        workouts: { type: integer }
        working_sets: { type: integer }
        warmup_sets: { type: integer }
        volume_kg: { type: number }
        max_weight_kg:
          oneOf:
            - $ref: "#/components/schemas/ExerciseBest"
            - type: "null"
        best_e1rm:
          oneOf:
            - $ref: "#/components/schemas/ExerciseBest"
            - type: "null"
        max_reps:
          oneOf:
            - $ref: "#/components/schemas/ExerciseBest"
            - type: "null"
        points:
          type: array
          items: { $ref: "#/components/schemas/ExerciseStatsPoint" }

    TrainingSummary:
      type: object
      required: [from, to, workouts, working_sets, warmup_sets, volume_kg, unrecorded_sets, by_exercise, by_muscle_group, by_week]
      properties:
        from: { type: string }
        to: { type: string }
        workouts: { type: integer }
        working_sets: { type: integer }
        warmup_sets: { type: integer }
        volume_kg: { type: number }
        unrecorded_sets: { type: integer }
        by_exercise:
          type: array
          items:
            type: object
            required: [exercise_id, exercise, working_sets, volume_kg]
            properties:
              exercise_id: { type: integer }
              exercise: { type: string }
              working_sets: { type: integer }
              volume_kg: { type: number }
        by_muscle_group:
          type: array
          items:
            type: object
            required: [muscle_group, working_sets, volume_kg]
            properties:
              muscle_group: { type: string, description: Empty for exercises without a muscle group. }
              working_sets: { type: integer }
              volume_kg: { type: number }
        by_week:
          type: array
          items:
            type: object
            required: [week_start, workouts, working_sets, volume_kg]
            properties:
              week_start: { type: string, description: First day of the week (configured week start). }
              workouts: { type: integer }
              working_sets: { type: integer }
              volume_kg: { type: number }

    Media:
      type: object
      required: [id, owner_type, owner_id, kind, filename, content_type, size_bytes, sha256, created_at]
      description: A stored video. Stream it from `/api/v1/media/{id}`.
      properties:
        id: { type: integer }
        owner_type: { type: string, enum: [set, exercise] }
        owner_id: { type: integer, description: Set id or exercise id. }
        kind: { type: string, enum: [video] }
        filename: { type: string }
        content_type: { type: string, enum: [video/mp4, video/quicktime, video/webm], description: Verified from the bytes. }
        size_bytes: { type: integer }
        sha256: { type: string, description: Hex SHA-256 of the bytes; also the ETag. }
        caption: { type: string, description: Omitted when empty. }
        created_at: { type: string, description: UTC timestamp. }

    ExerciseGuide:
      type: object
      required: [exercise_id, exercise, instructions, videos]
      properties:
        exercise_id: { type: integer }
        exercise: { type: string }
        instructions: { type: string, description: Empty when none are written. }
        videos:
          type: array
          items: { $ref: "#/components/schemas/Media" }

    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]

    Schedule:
      description: |
        When a plan is meant to be done, in the server timezone; weeks start on
        the configured day (Sunday by default). Either fixed weekdays or a weekly frequency.
      oneOf:
        - type: object
          title: Fixed weekdays
          additionalProperties: false
          required: [type, days]
          properties:
            type: { type: string, enum: [weekdays] }
            days:
              type: array
              minItems: 1
              maxItems: 7
              uniqueItems: true
              description: Stored lower-case and Monday first. Full names (e.g. `monday`) are accepted on input.
              items: { $ref: "#/components/schemas/Weekday" }
        - type: object
          title: Times per week
          additionalProperties: false
          required: [type, times_per_week]
          properties:
            type: { type: string, enum: [times_per_week] }
            times_per_week: { type: integer, minimum: 1, maximum: 7 }

    ScheduledPlan:
      type: object
      required: [plan_id, name, status]
      properties:
        plan_id: { type: integer }
        name: { type: string }
        status:
          type: string
          enum: [done, started, missed, due, upcoming]
          description: See GET /schedule.

    UnscheduledPlan:
      type: object
      required: [plan_id, name]
      properties:
        plan_id: { type: integer }
        name: { type: string }

    WorkoutRef:
      type: object
      required: [id, plan_id, working_sets, revision]
      description: The workout that exists on a date, whatever plan it follows.
      properties:
        id: { type: integer }
        plan_id: { type: [integer, "null"] }
        plan_name: { type: string, description: Omitted when the workout follows no plan. }
        working_sets: { type: integer, description: Completed non-warm-up sets. }
        revision: { type: integer }

    ScheduleDay:
      type: object
      required: [date, weekday, today, scheduled, workout]
      properties:
        date: { type: string }
        weekday: { $ref: "#/components/schemas/Weekday" }
        today: { type: boolean }
        scheduled:
          type: array
          items: { $ref: "#/components/schemas/ScheduledPlan" }
        workout:
          oneOf:
            - $ref: "#/components/schemas/WorkoutRef"
            - type: "null"

    WeeklyTarget:
      type: object
      required: [week_start, plan_id, name, target, completed, remaining, dates]
      properties:
        week_start: { type: string, description: First day of the week (configured week start). }
        plan_id: { type: integer }
        name: { type: string }
        target: { type: integer }
        completed: { type: integer }
        remaining: { type: integer, minimum: 0 }
        dates:
          type: array
          items: { type: string }

    ScheduleView:
      type: object
      required: [from, to, today, timezone, days, weekly_targets, unscheduled_plans]
      properties:
        from: { type: string }
        to: { type: string }
        today: { type: string }
        timezone: { type: string }
        days:
          type: array
          items: { $ref: "#/components/schemas/ScheduleDay" }
        weekly_targets:
          type: array
          items: { $ref: "#/components/schemas/WeeklyTarget" }
        unscheduled_plans:
          type: array
          items: { $ref: "#/components/schemas/UnscheduledPlan" }

    NutrientValue:
      type: [number, "null"]
      minimum: 0
      description: For the whole portion. `null` = not provided (never treated as 0).

    NutritionItem:
      type: object
      required: [name, amount_g, calories_kcal, protein_g, carbs_g, fat_g]
      description: One ingredient of a meal. Values are for the amount used.
      properties:
        name: { type: string }
        amount_g: { type: [number, "null"], description: Grams used; null = not given. }
        calories_kcal: { $ref: "#/components/schemas/NutrientValue" }
        protein_g: { $ref: "#/components/schemas/NutrientValue" }
        carbs_g: { $ref: "#/components/schemas/NutrientValue" }
        fat_g: { $ref: "#/components/schemas/NutrientValue" }

    NutritionItemInput:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        One ingredient, with values for the amount used. Absent or `null`
        values are not provided (never 0).
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        amount_g: { type: [number, "null"], exclusiveMinimum: 0, maximum: 5000, description: Grams used, if known. }
        calories_kcal: { type: [number, "null"], minimum: 0, maximum: 20000 }
        protein_g: { type: [number, "null"], minimum: 0, maximum: 2000 }
        carbs_g: { type: [number, "null"], minimum: 0, maximum: 2000 }
        fat_g: { type: [number, "null"], minimum: 0, maximum: 2000 }

    NutritionItemSuggestion:
      type: object
      required: [name, amount_g, calories_kcal, protein_g, carbs_g, fat_g, last_used, uses]
      description: An ingredient logged before, as last logged (values for its `amount_g`).
      properties:
        name: { type: string }
        amount_g: { type: [number, "null"] }
        calories_kcal: { $ref: "#/components/schemas/NutrientValue" }
        protein_g: { $ref: "#/components/schemas/NutrientValue" }
        carbs_g: { $ref: "#/components/schemas/NutrientValue" }
        fat_g: { $ref: "#/components/schemas/NutrientValue" }
        last_used: { type: string, description: Date of the entry it was last used in. }
        uses: { type: integer, description: How many times an ingredient with this name was logged. }

    NutritionEntry:
      type: object
      required: [id, date, name, calories_kcal, protein_g, carbs_g, fat_g, items, incomplete_values, copied_from, revision, created_at, updated_at]
      description: |
        One portion consumed on a local date. Values are for the whole portion;
        for a meal made of `items` they are the sums of the items' values.
      properties:
        id: { type: integer }
        date: { type: string, description: Consumption date in the server timezone. }
        name: { type: string }
        calories_kcal: { $ref: "#/components/schemas/NutrientValue" }
        protein_g: { $ref: "#/components/schemas/NutrientValue" }
        carbs_g: { $ref: "#/components/schemas/NutrientValue" }
        fat_g: { $ref: "#/components/schemas/NutrientValue" }
        items:
          type: array
          description: Ingredients in order; empty for a portion logged with its own values.
          items: { $ref: "#/components/schemas/NutritionItem" }
        incomplete_values:
          type: array
          description: |
            Values (`calories_kcal`, `protein_g`, `carbs_g`, `fat_g`) that only
            some items provide, so the meal's sum is partial. A value no item
            provides is `null` instead.
          items: { type: string, enum: [calories_kcal, protein_g, carbs_g, fat_g] }
        copied_from: { type: [integer, "null"], description: Source entry of a copy; the copy is independent. }
        revision: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    NutritionEntryInput:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Absent or `null` nutrients are not provided. Give either the portion's
        own values or `items` (the meal's values are then their sums), not both.
      properties:
        date: { type: string, description: "`YYYY-MM-DD` or `today` (default); today or earlier." }
        name: { type: string, minLength: 1, maxLength: 200 }
        calories_kcal: { type: [number, "null"], minimum: 0, maximum: 20000, description: kcal for the whole portion. }
        protein_g: { type: [number, "null"], minimum: 0, maximum: 2000, description: grams for the whole portion. }
        carbs_g: { type: [number, "null"], minimum: 0, maximum: 2000, description: grams for the whole portion. }
        fat_g: { type: [number, "null"], minimum: 0, maximum: 2000, description: grams for the whole portion. }
        items:
          type: [array, "null"]
          maxItems: 50
          description: Ingredients of the meal, each with values for the amount used. `null` = none.
          items: { $ref: "#/components/schemas/NutritionItemInput" }

    NutritionEntryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Merge-patch. Absent = unchanged; `null` clears a nutrient back to not
        provided; `null` on `name`, `date` or `items` is rejected. `items`
        replaces the whole ingredient list: a non-empty list recomputes the
        values from the items (values must not be given alongside it); `[]`
        removes the items and keeps the current sums as the entry's own,
        directly editable values. Values cannot be set directly on an entry
        that has items unless `items` is replaced in the same patch.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        date: { type: string }
        calories_kcal: { type: [number, "null"], minimum: 0, maximum: 20000 }
        protein_g: { type: [number, "null"], minimum: 0, maximum: 2000 }
        carbs_g: { type: [number, "null"], minimum: 0, maximum: 2000 }
        fat_g: { type: [number, "null"], minimum: 0, maximum: 2000 }
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/NutritionItemInput" }

    NutritionEntryResult:
      type: object
      required: [entry, replayed]
      properties:
        entry: { $ref: "#/components/schemas/NutritionEntry" }
        replayed: { type: boolean, description: True when an earlier request with the same Idempotency-Key is returned; nothing new was written. }

    TargetsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Number = set the daily target, `null` = remove it, absent = keep what is in effect on the date.
      properties:
        calories_kcal: { type: [number, "null"], minimum: 0, maximum: 20000 }
        protein_g: { type: [number, "null"], minimum: 0, maximum: 2000 }
        carbs_g: { type: [number, "null"], minimum: 0, maximum: 2000 }
        fat_g: { type: [number, "null"], minimum: 0, maximum: 2000 }

    NutritionTargets:
      type: object
      required: [calories_kcal, protein_g, carbs_g, fat_g, revision]
      description: |
        Daily targets in effect on a date. A change applies from
        `effective_from` until the next change and never alters earlier dates.
      properties:
        effective_from: { type: string, description: Date of the change that applies; omitted when no target was ever set. }
        calories_kcal: { type: [number, "null"], description: kcal per day; null = no target. }
        protein_g: { type: [number, "null"], description: g per day; null = no target. }
        carbs_g: { type: [number, "null"], description: g per day; null = no target. }
        fat_g: { type: [number, "null"], description: g per day; null = no target. }
        revision: { type: integer, description: Identifies the change; 0 when none. The If-Match for the next change. }

    NutrientSummary:
      type: object
      required: [consumed, entries_missing_value, target, remaining, over]
      properties:
        consumed: { type: number, description: Sum over the entries that provided this value. }
        entries_missing_value: { type: integer, description: Entries without this value; when > 0 the total may be incomplete. }
        target: { type: [number, "null"], description: null = no target. }
        remaining: { type: [number, "null"], description: "target - consumed when positive, else 0; null without a target." }
        over: { type: [number, "null"], description: "consumed - target when positive, else 0; null without a target." }

    NutritionDay:
      type: object
      required: [date, today, entry_count, calories_kcal, protein_g, carbs_g, fat_g, targets, entries]
      description: Computed on read from the stored entries.
      properties:
        date: { type: string }
        today: { type: boolean }
        entry_count: { type: integer }
        calories_kcal: { $ref: "#/components/schemas/NutrientSummary" }
        protein_g: { $ref: "#/components/schemas/NutrientSummary" }
        carbs_g: { $ref: "#/components/schemas/NutrientSummary" }
        fat_g: { $ref: "#/components/schemas/NutrientSummary" }
        targets: { $ref: "#/components/schemas/NutritionTargets" }
        entries:
          type: array
          description: Chronological.
          items: { $ref: "#/components/schemas/NutritionEntry" }

    WeighIn:
      type: object
      required: [id, date, weight_kg, revision, created_at, updated_at]
      description: The body weight recorded for one local date (at most one per date).
      properties:
        id: { type: integer }
        date: { type: string, description: Local date in the server timezone. }
        weight_kg: { type: number, description: Kilograms, rounded to 0.01. }
        note: { type: string, description: Omitted when empty. }
        revision: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    WeighInInput:
      type: object
      additionalProperties: false
      required: [weight_kg]
      properties:
        weight_kg: { type: number, minimum: 20, maximum: 400, description: Kilograms. }
        note: { type: string, maxLength: 200 }

    WeightWeek:
      type: object
      required: [week_start, week_end, days_logged, average_kg, min_kg, max_kg, change_kg, change_pct]
      description: One week (from the configured week start). Statistics use only the days with a weigh-in.
      properties:
        week_start: { type: string, description: First day of the week (configured week start). }
        week_end: { type: string, description: The Sunday. }
        days_logged: { type: integer }
        average_kg: { type: [number, "null"], description: Mean of the logged days; null when none. }
        min_kg: { type: [number, "null"] }
        max_kg: { type: [number, "null"] }
        change_kg: { type: [number, "null"], description: This week's average minus the previous week's; null when either week has no weigh-in. }
        change_pct: { type: [number, "null"], description: change_kg as a percentage of the previous week's average. }
        trend: { type: string, enum: [up, down, flat], description: "flat when |change_kg| < 0.1; omitted without a change." }

    WeightTrend:
      type: object
      required: [from, to, today, weeks, entries, latest, overall_change_kg]
      properties:
        from: { type: string, description: First day of the first week. }
        to: { type: string }
        today: { type: string }
        weeks:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/WeightWeek" }
        entries:
          type: array
          description: Weigh-ins from `from` to `to`, oldest first.
          items: { $ref: "#/components/schemas/WeighIn" }
        latest:
          description: The most recent weigh-in on or before `to` (may be older than `from`).
          oneOf:
            - { $ref: "#/components/schemas/WeighIn" }
            - { type: "null" }
        overall_change_kg: { type: [number, "null"], description: Last week with a weigh-in minus the first one in the range; null with fewer than two such weeks. }
